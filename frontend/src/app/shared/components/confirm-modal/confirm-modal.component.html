@if (isOpen) {
  <div
    class="modal-backdrop"
    (click)="onCancel()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    aria-describedby="modal-description"
  >
    <div class="modal-card" [ngClass]="type" (click)="$event.stopPropagation()">
      <!-- Optional Top Close "X" Button -->
      @if (showCloseBtn) {
        <button
          class="btn-close"
          (click)="onCancel()"
          [disabled]="isLoading"
          aria-label="Close modal"
        >
          <mat-icon>close</mat-icon>
        </button>
      }

      <!-- Semantic Icon Badge -->
      <div class="icon-container" [ngClass]="type">
        <mat-icon class="modal-icon">{{ getIconName() }}</mat-icon>
      </div>

      <!-- Content -->
      <div class="modal-body">
        <h3 id="modal-title" class="modal-title">{{ title }}</h3>
        @if (message) {
          <p id="modal-description" class="modal-message">{{ message }}</p>
        }
      </div>

      <!-- Action Buttons -->
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" (click)="onCancel()" [disabled]="isLoading">
          {{ cancelText }}
        </button>

        <button
          type="button"
          class="btn btn-confirm"
          [ngClass]="type"
          (click)="onConfirm()"
          [disabled]="isLoading"
        >
          @if (isLoading) {
            <span class="spinner"></span>
          }
          <span>{{ confirmText }}</span>
        </button>
      </div>
    </div>
  </div>
}
