<div class="auth-page" dir="rtl">
  <div class="auth-card">
    <div class="card-header">
      <h2>ورود به حساب کاربری</h2>
      <p class="auth-subtitle">خوش آمدید! برای دسترسی به پنل دوره‌ها وارد شوید.</p>
    </div>

    <!-- Error Alert -->
    <div class="alert alert-error" *ngIf="errorMessage()" @fadeSlide>
      <mat-icon>error_outline</mat-icon>
      <span>{{ errorMessage() }}</span>
      <button class="alert-close" type="button" (click)="errorMessage.set('')">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Email -->
      <div class="form-group">
        <label for="email">
          <mat-icon>alternate_email</mat-icon>
          ایمیل
        </label>
        <div class="input-wrapper">
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="example@gmail.com"
            [class.invalid]="isInvalid('email')"
            [class.valid]="isValid('email')"
            autocomplete="email"
            dir="ltr"
          />
          <mat-icon class="input-status success" *ngIf="isValid('email')">check_circle</mat-icon>
          <mat-icon class="input-status error" *ngIf="isInvalid('email')">error</mat-icon>
        </div>
        <span class="validation-error" *ngIf="isInvalid('email')" @fadeSlide>
          <mat-icon>info</mat-icon>
          لطفاً یک ایمیل معتبر وارد کنید
        </span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">
          <mat-icon>lock</mat-icon>
          رمز عبور
        </label>
        <div class="input-wrapper password-input">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            [class.invalid]="isInvalid('password')"
            [class.valid]="isValid('password')"
            autocomplete="current-password"
          />
          <button type="button" class="eye-btn" (click)="togglePasswordVisibility()" tabindex="-1">
            <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <span class="validation-error" *ngIf="isInvalid('password')" @fadeSlide>
          <mat-icon>info</mat-icon>
          رمز عبور باید حداقل ۸ کاراکتر باشد
        </span>
      </div>

      <div class="forgot-link">
        <a routerLink="/auth/forgot-password">رمز عبور خود را فراموش کرده‌اید؟</a>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="loginForm.invalid || authService.isLoading()"
      >
        <span *ngIf="!authService.isLoading()" class="btn-content">
          <span>ورود به حساب</span>
          <mat-icon>login</mat-icon>
        </span>
        <span *ngIf="authService.isLoading()" class="btn-loading">
          <span class="spinner"></span>
          در حال ورود...
        </span>
      </button>
    </form>

    <div class="divider">
      <span>یا</span>
    </div>

    <div class="social-login">
      <button type="button" class="social-btn google" (click)="loginWithGoogle()">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
          />
        </svg>
        <span>ورود با گوگل</span>
      </button>

      <button type="button" class="social-btn github" (click)="loginWithGithub()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
          />
        </svg>
        <span>ورود با گیت‌هاب</span>
      </button>
    </div>

    <div class="auth-footer">
      <span>کاربر جدید هستید؟</span>
      <a routerLink="/auth/register">
        یک حساب جدید بسازید
        <mat-icon>arrow_back</mat-icon>
      </a>
    </div>
  </div>
</div>
