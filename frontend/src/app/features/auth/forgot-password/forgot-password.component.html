<div
  class="auth-page flex justify-center items-center min-h-[calc(100vh-64px)] bg-slate-50"
  dir="rtl"
>
  <div class="auth-card p-8 border bg-white rounded-2xl w-full max-w-md shadow-sm">
    <h2 class="text-xl font-black text-center mb-2">فراموشی رمز عبور 🔑</h2>
    <p class="text-xs text-slate-400 text-center mb-6">
      ایمیل خود را وارد کنید تا کد بازیابی ارسال شود.
    </p>

    <div
      class="bg-red-50 text-red-500 border border-red-100 p-3 rounded-lg flex items-center gap-2 mb-4 text-xs font-bold"
      *ngIf="errorMessage()"
    >
      <mat-icon class="text-sm">error</mat-icon> {{ errorMessage() }}
    </div>

    <div
      class="bg-green-50 text-green-600 border border-green-100 p-3 rounded-lg flex items-center gap-2 mb-4 text-xs font-bold"
      *ngIf="successMessage()"
    >
      <mat-icon class="text-sm">check_circle</mat-icon> {{ successMessage() }}
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage()">
      <div class="flex flex-col gap-1.5 mb-4">
        <label class="font-bold text-xs text-slate-700">ایمیل ثبت‌نامی</label>
        <input
          type="email"
          formControlName="email"
          placeholder="example@gmail.com"
          class="border px-4 py-2.5 rounded-lg outline-none focus:border-purple-500 text-sm"
        />
      </div>
      <button
        type="submit"
        [disabled]="forgotForm.invalid || isLoading()"
        class="w-full bg-purple-600 text-white font-bold py-3 rounded-lg text-sm transition"
      >
        {{ isLoading() ? 'در حال ارسال...' : 'ارسال کد بازیابی' }}
      </button>
    </form>

    <div class="text-center mt-6">
      <a routerLink="/auth/login" class="text-xs font-bold text-purple-600">بازگشت به صفحه ورود</a>
    </div>
  </div>
</div>
